name: Build Signed Release APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.2 - leave empty for auto 1.0.X)'
        required: false
        default: ''
      version_code:
        description: 'Version Code (Integer, e.g. 12 - leave blank for auto increment)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Determine Version Code and Name
        id: versioning
        run: |
          if [ -n "${{ inputs.version_code }}" ]; then
            V_CODE="${{ inputs.version_code }}"
          else
            V_CODE=$(( 10 + ${{ github.run_number }} ))
          fi

          if [ -n "${{ inputs.version_name }}" ]; then
            V_NAME="${{ inputs.version_name }}"
          else
            # Auto-incrementing version name based on version code
            V_NAME="1.0.${V_CODE}"
          fi

          echo "Determined Version Code: $V_CODE"
          echo "Determined Version Name: $V_NAME"
          echo "v_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "v_name=$V_NAME" >> $GITHUB_OUTPUT

      - name: Build Release APK and AAB Bundle with Gradle
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionCode=${{ steps.versioning.outputs.v_code }} \
            -PversionName=${{ steps.versioning.outputs.v_name }} \
            --no-daemon

      - name: Sign Release APK & AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'android123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || '' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'android123' }}
          V_NAME: ${{ steps.versioning.outputs.v_name }}
        run: |
          echo "Locating generated Release APK and AAB..."
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          UNSIGNED_AAB=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          
          mkdir -p output_release
          # Store keystore in secure temporary location outside release outputs
          KS_PATH="/tmp/gothwad_release_key.jks"
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using Permanent Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
          else
            echo "⚠️ No GitHub Secret found! Generating temporary keystore..."
            DEFAULT_ALIAS="${KEY_ALIAS:-gothwad_tv_key}"
            keytool -genkey -v \
              -keystore "$KS_PATH" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$DEFAULT_ALIAS" \
              -dname "CN=Gothwad TV Browser, OU=AppDev, O=Gothwad, C=IN" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS"
          fi

          # Dynamically detect exact Alias name from the keystore
          DETECTED_ALIAS=$(keytool -list -v -keystore "$KS_PATH" -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | sed 's/.*Alias name: //I' | tr -d '\r' | xargs)
          
          if [ -n "$KEY_ALIAS" ]; then
            ACTUAL_ALIAS="$KEY_ALIAS"
          elif [ -n "$DETECTED_ALIAS" ]; then
            ACTUAL_ALIAS="$DETECTED_ALIAS"
          else
            ACTUAL_ALIAS="gothwad_tv_key"
          fi
          
          echo "Using Keystore Alias: $ACTUAL_ALIAS"
          
          # Find latest zipalign and apksigner dynamically
          ZIPALIGN=$(find $ANDROID_HOME/build-tools/ -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
          
          # 1. Sign APK
          if [ -n "$UNSIGNED_APK" ]; then
            UNALIGNED_TEMP="/tmp/unaligned_temp.apk"
            if [ -n "$ZIPALIGN" ]; then
              $ZIPALIGN -v -p 4 "$UNSIGNED_APK" "$UNALIGNED_TEMP" || cp "$UNSIGNED_APK" "$UNALIGNED_TEMP"
            else
              cp "$UNSIGNED_APK" "$UNALIGNED_TEMP"
            fi
            
            $APKSIGNER sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$ACTUAL_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out output_release/GothwadTVBrowser-v${V_NAME}-Release.apk \
              "$UNALIGNED_TEMP"
              
            $APKSIGNER verify --verbose output_release/GothwadTVBrowser-v${V_NAME}-Release.apk
            rm -f "$UNALIGNED_TEMP"
          fi
          
          # 2. Sign Play Store AAB Bundle using jarsigner
          if [ -n "$UNSIGNED_AAB" ]; then
            cp "$UNSIGNED_AAB" output_release/GothwadTVBrowser-v${V_NAME}-PlayStore.aab
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KS_PATH" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
              output_release/GothwadTVBrowser-v${V_NAME}-PlayStore.aab \
              "$ACTUAL_ALIAS"
            echo "Successfully signed Play Store AAB!"
          fi

          # Securely destroy the temporary keystore file so it is never exposed or uploaded
          rm -f "$KS_PATH"
          echo "Keystore securely cleaned up."

      - name: Upload Signed Release APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gothwad-TV-Browser-v${{ steps.versioning.outputs.v_name }}-Build${{ steps.versioning.outputs.v_code }}
          path: output_release/

      - name: Create Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.versioning.outputs.v_name }}
          name: Gothwad TV Browser v${{ steps.versioning.outputs.v_name }} (Build ${{ steps.versioning.outputs.v_code }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            output_release/GothwadTVBrowser-v${{ steps.versioning.outputs.v_name }}-Release.apk
            output_release/GothwadTVBrowser-v${{ steps.versioning.outputs.v_name }}-PlayStore.aab
