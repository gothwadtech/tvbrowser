name: Build Signed Release APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Release APK and AAB Bundle with Gradle
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign Release APK & AAB
        run: |
          echo "Locating generated Release APK and AAB..."
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          UNSIGNED_AAB=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          
          mkdir -p output_release
          
          # Generate permanent release keystore
          keytool -genkey -v \
            -keystore output_release/gothwad_release_key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias gothwad_tv_key \
            -dname "CN=Gothwad TV Browser, OU=AppDev, O=Gothwad, C=IN" \
            -storepass android123 -keypass android123
          
          # Find latest zipalign and apksigner dynamically
          ZIPALIGN=$(find $ANDROID_HOME/build-tools/ -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
          
          # 1. Sign APK
          if [ -n "$UNSIGNED_APK" ]; then
            if [ -n "$ZIPALIGN" ]; then
              $ZIPALIGN -v -p 4 "$UNSIGNED_APK" output_release/GothwadTVBrowser-v1.0.0-unaligned.apk || cp "$UNSIGNED_APK" output_release/GothwadTVBrowser-v1.0.0-unaligned.apk
            else
              cp "$UNSIGNED_APK" output_release/GothwadTVBrowser-v1.0.0-unaligned.apk
            fi
            
            $APKSIGNER sign \
              --ks output_release/gothwad_release_key.jks \
              --ks-key-alias gothwad_tv_key \
              --ks-pass pass:android123 \
              --key-pass pass:android123 \
              --out output_release/GothwadTVBrowser-v1.0.0-Release.apk \
              output_release/GothwadTVBrowser-v1.0.0-unaligned.apk
              
            $APKSIGNER verify --verbose output_release/GothwadTVBrowser-v1.0.0-Release.apk
            rm -f output_release/*unaligned.apk
          fi
          
          # 2. Sign Play Store AAB Bundle using jarsigner
          if [ -n "$UNSIGNED_AAB" ]; then
            cp "$UNSIGNED_AAB" output_release/GothwadTVBrowser-v1.0.0-PlayStore.aab
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore output_release/gothwad_release_key.jks \
              -storepass android123 -keypass android123 \
              output_release/GothwadTVBrowser-v1.0.0-PlayStore.aab \
              gothwad_tv_key
            echo "Successfully signed Play Store AAB!"
          fi

      - name: Upload Signed Release APK, AAB & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Gothwad-TV-Browser-v1.0.0-Production-Binaries
          path: output_release/

