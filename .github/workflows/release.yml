name: Release to GitHub Releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build_release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build Release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign Release APK & AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'android123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'gothwad_key' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'android123' }}
        run: |
          mkdir -p release_out
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          AAB=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using Permanent Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release_out/release_key.jks
          else
            echo "⚠️ No GitHub Secret found! Generating temporary keystore (Warning: will mismatch across builds)..."
            keytool -genkey -v \
              -keystore release_out/release_key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$KEY_ALIAS" \
              -dname "CN=Gothwad TV Browser, O=Gothwad, C=IN" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS"
          fi

          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APK" ]; then
            $APKSIGNER sign \
              --ks release_out/release_key.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out release_out/GothwadTVBrowser-v${{ inputs.version }}-Release.apk \
              "$APK"
          fi

          if [ -n "$AAB" ]; then
            cp "$AAB" release_out/GothwadTVBrowser-v${{ inputs.version }}-PlayStore.aab
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release_out/release_key.jks \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
              release_out/GothwadTVBrowser-v${{ inputs.version }}-PlayStore.aab \
              "$KEY_ALIAS"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Gothwad TV Browser v${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            release_out/GothwadTVBrowser-v${{ inputs.version }}-Release.apk
            release_out/GothwadTVBrowser-v${{ inputs.version }}-PlayStore.aab
            release_out/release_key.jks
