name: Release to GitHub Releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (e.g. 1.0.1)'
        required: true
        default: '1.0.1'
      version_code:
        description: 'Version Code (Integer, e.g. 2, 3... leave blank for auto increment)'
        required: false
        default: ''

jobs:
  build_release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Determine Version Code
        id: versioning
        run: |
          if [ -n "${{ inputs.version_code }}" ]; then
            V_CODE="${{ inputs.version_code }}"
          else
            V_CODE=$(( 10 + ${{ github.run_number }} ))
          fi
          echo "Determined Version Code: $V_CODE"
          echo "v_code=$V_CODE" >> $GITHUB_OUTPUT

      - name: Build Release APK and AAB
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionCode=${{ steps.versioning.outputs.v_code }} \
            -PversionName=${{ inputs.version }} \
            --no-daemon

      - name: Sign Release APK & AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'android123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || '' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'android123' }}
        run: |
          mkdir -p release_out
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          AAB=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          KS_PATH="release_out/release_key.jks"
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using Permanent Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
          else
            echo "⚠️ No GitHub Secret found! Generating temporary keystore..."
            DEFAULT_ALIAS="${KEY_ALIAS:-gothwad_key}"
            keytool -genkey -v \
              -keystore "$KS_PATH" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$DEFAULT_ALIAS" \
              -dname "CN=Gothwad TV Browser, O=Gothwad, C=IN" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS"
          fi

          # Dynamically detect exact Alias name from the keystore
          DETECTED_ALIAS=$(keytool -list -v -keystore "$KS_PATH" -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | sed 's/.*Alias name: //I' | tr -d '\r' | xargs)
          
          if [ -n "$KEY_ALIAS" ]; then
            ACTUAL_ALIAS="$KEY_ALIAS"
          elif [ -n "$DETECTED_ALIAS" ]; then
            ACTUAL_ALIAS="$DETECTED_ALIAS"
          else
            ACTUAL_ALIAS="gothwad_key"
          fi
          
          echo "Using Keystore Alias: $ACTUAL_ALIAS"

          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APK" ]; then
            $APKSIGNER sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$ACTUAL_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out release_out/GothwadTVBrowser-v${{ inputs.version }}-Release.apk \
              "$APK"
          fi

          if [ -n "$AAB" ]; then
            cp "$AAB" release_out/GothwadTVBrowser-v${{ inputs.version }}-PlayStore.aab
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KS_PATH" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
              release_out/GothwadTVBrowser-v${{ inputs.version }}-PlayStore.aab \
              "$ACTUAL_ALIAS"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Gothwad TV Browser v${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            release_out/GothwadTVBrowser-v${{ inputs.version }}-Release.apk
            release_out/GothwadTVBrowser-v${{ inputs.version }}-PlayStore.aab
            release_out/release_key.jks
