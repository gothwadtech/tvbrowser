name: Release to GitHub Releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build_release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign Release APK
        run: |
          mkdir -p release_out
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          keytool -genkey -v \
            -keystore release_out/release_key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias gothwad_key \
            -dname "CN=Gothwad TV Browser, O=Gothwad, C=IN" \
            -storepass android123 -keypass android123

          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
          $APKSIGNER sign \
            --ks release_out/release_key.jks \
            --ks-key-alias gothwad_key \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --out release_out/GothwadTVBrowser-v${{ inputs.version }}-Release.apk \
            "$APK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Gothwad TV Browser v${{ inputs.version }}
          draft: false
          prerelease: false
          files: release_out/GothwadTVBrowser-v${{ inputs.version }}-Release.apk

